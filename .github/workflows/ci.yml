name: Build
run-name: ${{ github.actor }}'s CI/CD Run on Commit "${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Configure Git BEFORE checkout to prevent any default identity usage
      - name: Configure Git identity (global)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Checkout repository
        uses: actions/checkout@v4

      # Verify Git configuration immediately after checkout
      - name: Verify Git configuration
        run: |
          echo "=== Git Configuration Debug ==="
          echo "Git user name: '$(git config user.name)'"
          echo "Git user email: '$(git config user.email)'"
          echo "Global Git user name: '$(git config --global user.name)'"
          echo "Global Git user email: '$(git config --global user.email)'"
          
          # Check if there are any local repo configs overriding global
          echo "Local repo Git config:"
          git config --local --list | grep -E '^user\.' || echo "No local user config found"
          
          echo "Git status:"
          git status --porcelain || echo "Git status failed"
          echo "==============================="

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make cmake clang-tidy

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Static Analysis
        run: clang-tidy -p build src/main.cpp src/extraction/qc_extractor.cpp src/job_management/job_scheduler.cpp

      - name: Build the project
        run: cmake --build build

      - name: Prepare test data
        run: |
          cp tests/gaussian/*.log .
          cp tests/extract-xyz/*.log tests/extract-xyz/*.LOG tests/extract-xyz/*.Log tests/extract-xyz/*.out tests/extract-xyz/*.OUT .
          cp tests/create-input/*.xyz .

      - name: Run Tests
        id: run_tests
        run: |
          # Try both possible binary locations
          if [ -f "./build/bin/cck" ]; then
            BINARY="./build/bin/cck"
          elif [ -f "./build/cck" ]; then
            BINARY="./build/cck"
          elif [ -f "./cck" ]; then
            BINARY="./cck"
          else
            echo "Test failed: cck binary not found."
            exit 1
          fi

          $BINARY -q -f csv

          if ! ls *.csv >/dev/null 2>&1; then
            echo "Test failed: No .csv file generated."
            exit 1
          fi

          csv_file=$(ls *.csv | head -n 1)
          if [ ! -s "$csv_file" ]; then
            echo "Test failed: $csv_file is empty."
            exit 1
          fi

          echo "Basic extraction tests passed."

      - name: Test Coordinate Extraction (xyz)
        run: |
          echo "TODO: implement xyz test"

      - name: Test Create Input (ci)
        run: |
          echo "TODO: implement ci test"

      - name: Test Parameter Template Generation
        run: |
          echo "TODO: implement parameter template generation test"

      - name: Test Parameter File Loading
        run: |
          echo "TODO: implement parameter file loading test"

      - name: Process log and out files
        if: ${{ success() || steps.run_tests.conclusion == 'success' }}
        run: |
          echo "TODO: implement log/out processing"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-results
          path: |
            *.results
            *.csv
            *.xyz
            *.gau
            *.params
            test_templates/
            gaussian-extractor_*_coord/
          if-no-files-found: warn

      - name: Display results
        if: always()
        run: |
          echo "TODO: display results"

      - name: Cleanup test files
        if: always()
        run: |
          rm -f *.log *.out *.LOG *.Log *.OUT *.xyz *.gau *.params *.results *.csv
          rm -rf test_templates gaussian-extractor_*_coord
